<svg width="200" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="80" fill="#000000"/>
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#00ff00" text-anchor="middle" filter="url(#glow)" letter-spacing="3">STAKE</text>
  <circle cx="25" cy="40" r="10" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.6"/>
  <circle cx="175" cy="40" r="10" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="65" x2="150" y2="65" stroke="#00ff00" stroke-width="2" opacity="0.3"/>
</svg>
