<svg width="200" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="80" fill="#000000"/>
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#greenGradient)" text-anchor="middle" filter="url(#glow)">JOE FORTUNE</text>
  <text x="100" y="58" font-family="Arial, sans-serif" font-size="14" fill="#00ff00" text-anchor="middle" opacity="0.7">CASINO</text>
  <circle cx="40" cy="40" r="12" fill="#00ff00" opacity="0.2"/>
  <circle cx="160" cy="40" r="12" fill="#00ff00" opacity="0.2"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00ff00" text-anchor="middle">$</text>
  <text x="160" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00ff00" text-anchor="middle">$</text>
</svg>
